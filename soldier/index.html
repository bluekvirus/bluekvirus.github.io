<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poly Soldier</title>
<meta name="description" content="A modular low-poly soldier rendered in Babylon.js.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #20242b; }
  #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #label {
    position: fixed; left: 20px; bottom: 18px;
    font: 500 12px/1.5 "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: #7f8794;
    pointer-events: none; user-select: none;
  }
  #label b { color: #c3cad4; font-weight: 600; }
</style>
</head>
<body>
<canvas id="view" touch-action="none"></canvas>
<div id="label"><b>Poly Soldier</b> — drag to orbit, scroll to zoom</div>

<script
  src="https://cdn.jsdelivr.net/npm/babylonjs@9.18.1/babylon.js"
  integrity="sha384-PHVMLQIlVKtLXOC0vSJTdGPLWru+b8vwe3YKDjM39sdPGcM7RPIdRh39jYC2zkGY"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
